name: Backend quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Dependency audit
        run: pnpm audit

      - name: Check Drizzle schema
        run: pnpm db:check
        env:
          DATABASE_URL_UNPOOLED: postgresql://user:password@localhost:5432/collision_canary

      - name: Check trusted public URL handling
        run: pnpm test:public-base-url
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/collision_canary
